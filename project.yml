# The Xcode project is generated from this file; LowTalker.xcodeproj is gitignored.
# [LAW:one-source-of-truth] Every build setting the app needs lives here, including
# the Info.plist keys, so there is no second file to hand-edit or review.
name: LowTalker

options:
  deploymentTarget:
    macOS: "15.0"

# One build configuration, so there is one way a bundle is built. A development build is
# the release recipe run under the development identity: same optimisation, same single
# Mach-O (Debug splits the code into a stub and a `.debug.dylib` beside it), same
# entitlements, same timestamped signature. Anything that differs between the build a
# person develops on and the build they ship is a path the development build never ran.
# [LAW:no-mode-explosion] [LAW:one-type-per-behavior]
configs:
  Release: release

# Shared by every target. macOS keys the Microphone grant to the signing certificate, so
# builds carry a self-signed identity that `make signing-identity` creates on a Mac's first build.
# Ad hoc signing would key the grant to each build's own hash and lose it on every
# rebuild. scripts/signing-identity reads it for `make signing-identity`.
#
# The identity is the one setting a build to hand to someone else changes:
# scripts/sign-release passes the Developer ID certificate, which Gatekeeper trusts and
# notarization accepts, in its place. No DEVELOPMENT_TEAM here, on purpose: Xcode takes a
# team as a filter on certificates, and the self-signed identity belongs to none, so a team
# set for every build fails every development build with "No certificate for team". The
# team rides inside the certificate's name, which scripts/sign-release spells in full.
#
# Everything else notarization asks of a signature is set here for every build, the
# development build included, so the two are signed alike: the Hardened Runtime; no
# get-task-allow entitlement, which CODE_SIGN_INJECT_BASE_ENTITLEMENTS would add; and a
# secure timestamp, which Xcode leaves out (--timestamp=none) unless told. The likeness
# costs the development build two things. A hardened process without get-task-allow refuses
# a debugger, so lldb and Instruments cannot attach to it; the unified log is how it is
# read, as it is for the shipped build. And codesign asks Apple's timestamp server for each
# signature, measured at 0.6 s with the self-signed identity, so a build with no network
# fails to sign.
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: LowTalker Dev
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    OTHER_CODE_SIGN_FLAGS: --timestamp
    # [LAW:one-source-of-truth] The one place a version is written. Every bundle takes both
    # from here: GENERATE_INFOPLIST_FILE fills CFBundleShortVersionString and CFBundleVersion
    # from these settings and drops the keys when they are unset, which is how every build
    # before low-packaging-0rc shipped with no version at all. LaunchServices keys a
    # bundle's registration by it, and every input method macOS ships carries both.
    # CURRENT_PROJECT_VERSION counts releases, so it rises with each one; v0.1.0-alpha.3 was
    # the third. scripts/release refuses a build number no higher than the count of release
    # tags on other commits.
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: "9"

packages:
  # [LAW:one-way-deps] The app links the SwiftPM package at the repo root; the
  # package knows nothing of the app.
  low-talker:
    path: .

# Every name below is `AppIdentity`'s in Sources/Identity; xcodegen cannot read Swift, so they
# are written again here, and `ProjectIdentityTests`, `AppEntitlementsTests` and
# `InputMethodPlistTests` hold these copies to that one. [LAW:one-source-of-truth]
targets:
  # The app. A development build and a release build are this one target: they differ in
  # the certificate that signs them and in ACCEPTS_CONNECTIONS, and in nothing else.
  LowTalker:
    type: application
    platform: macOS
    sources:
      - App/LowTalker
    dependencies:
      # And not ModelInstall, the store's write side: the app loads the store its bundle
      # carries and has no way to fetch one, which `AppLinksNoInstallerTests` reads off
      # this list and Package.swift. [LAW:one-way-deps]
      - package: low-talker
        product: LowTalkerCore
      # The grants the menu reads, beneath both the core and the setup list.
      - package: low-talker
        product: Grants
      # The list of what must hold before low-talker can type, which the menu shows and the
      # guided setup walks. One list, two views. [LAW:one-source-of-truth]
      - package: low-talker
        product: Onboarding
      # Whether the app's icon is in the menu bar as its own: main.swift hands a launch a
      # terminal made to LaunchServices, and the delegate says when the icon never showed.
      - package: low-talker
        product: MenuBarPresence
      # The menu's error rows, which a click copies.
      - package: low-talker
        product: StatusMenu
      # When the loop comes up, is rebuilt, or is left as it stands.
      - package: low-talker
        product: LoopLifecycle
      - package: low-talker
        product: Signals
      - package: low-talker
        product: Dictation
      # The channel that asks the input method to insert, and the install that puts that
      # input method where macOS looks for one.
      - package: low-talker
        product: Insertion
      - package: low-talker
        product: InputSource
      # The transcription server, which only the network build switches on: see
      # ServerSwitch.ifEntitled.
      - package: low-talker
        product: Serve
      # The Benchmark window and `LowTalker --bench`, which load models in place from the
      # carried store or a picked one, as the app does, and never install one.
      - package: low-talker
        product: Bench
      # The input method bundle, built beside the app and not inside it: the installer
      # package puts it in /Library/Input Methods, the one place the text input system lists
      # it from that an app under App Sandbox does not write to. A dependency so that
      # building the app's scheme builds the input method its package carries.
      - target: LowTalkerInputMethod
        embed: false
    # Every entitlement here is named with the failure that required it, read off a
    # Hardened Runtime build rather than guessed; one nobody can name is removed.
    # xcodegen writes the plist from these properties on every generate, so the file
    # it writes is build output, ignored like the project beside it.
    #
    # com.apple.security.device.audio-input: with the runtime on and this absent, tccd
    # logs "Prompting policy for hardened runtime; service: kTCCServiceMicrophone
    # requires entitlement com.apple.security.device.audio-input but it is missing".
    # A Mac that already granted the microphone keeps hearing; a Mac that has not is
    # never asked, and the app is deaf.
    #
    # com.apple.security.app-sandbox: what makes "no network" a property of the build rather
    # than a promise. Measured under it on 2026-09-28, the app launches, loads its carried
    # model, captures the microphone and reads its input source with nothing more; with no
    # network entitlement, connect() and getaddrinfo are refused as `network-outbound`.
    #
    # com.apple.security.files.user-selected.read-only: the Benchmark window's Choose…
    # buttons, without it, show nothing, and AppKit logs "Unable to display open panel: your
    # app is missing the User Selected File Read app sandbox entitlement" (studious,
    # 2026-10-03). Read-only: the bench reads fixtures and a model store and writes neither.
    #
    # The two Mach names, each denied by the sandbox without its line: the app registers
    # its hotkey port (`mach-register`, Sources/Insertion/NamedPort.swift) and looks up the
    # input method's insert port (`mach-lookup`, Sources/Insertion/Inserter.swift).
    # `AppEntitlementsTests` holds these, and nothing beside them, to `AppIdentity`'s names.
    entitlements:
      path: App/Generated/LowTalker.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.audio-input: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.temporary-exception.mach-register.global-name:
          - ai.promptctl.low-talker.hotkey
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - ai.promptctl.low-talker.inputmethod.dictation.insert
    # A bundle carries what a first run would otherwise fetch: a store holding its model, so
    # a first launch loads it with the network off. Copied in after every other phase, so
    # the signature Xcode writes last seals it with the rest of the bundle. `make` passes
    # BUNDLED_MODEL_STORE; a build that names none carries none.
    postBuildScripts:
      - name: Carry what a first run would fetch
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          resources="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          # The model is synced, never removed and copied again. The Neural Engine keys its
          # compiled model on the files themselves, so a store rewritten by every build is a
          # new model to it, and every launch after a build paid the whole compile again -
          # measured at 2.5 to 4 minutes, against seconds for files it has seen. `--delete`
          # keeps what the removal was for: Xcode leaves a file it did not make in the
          # bundle, so nothing an earlier build carried may ride along. Files that did not
          # change are not touched at all.
          # An empty setting reaches the script unset, not empty.
          if [ -n "${BUNDLED_MODEL_STORE:-}" ]; then
            mkdir -p "${resources}/${MODEL_STORE_RESOURCE}"
            rsync -a --delete "${BUNDLED_MODEL_STORE}/" "${resources}/${MODEL_STORE_RESOURCE}/"
          else
            rm -rf "${resources}/${MODEL_STORE_RESOURCE}"
          fi
      # The notices the licenses of what the bundle ships require, written from the
      # committed SBOM on every build, so no bundle is built without them. scripts/notices stops the build on a component it has no
      # license text for. [LAW:one-source-of-truth]
      - name: Carry the notices its licenses require
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/sbom/lowtalker.cdx.json
        script: |
          set -euo pipefail
          "${SRCROOT}/scripts/notices" "${SRCROOT}/sbom/lowtalker.cdx.json" \
            "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/${NOTICES_RESOURCE}"
      # The config a person wrote before the sandbox, in ~/.config/low-talker, which the
      # sandboxed app cannot read. macOS reads Contents/Resources/container-migration.plist
      # once, when it creates the container at the first sandboxed launch, and moves each
      # listed file in. Without it an upgrade runs on the defaults and says nothing.
      # Measured 2026-09-29 with a throwaway sandboxed bundle: the file moved, and the
      # original left its old directory.
      - name: Carry the config from before the sandbox
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0"><dict><key>Move</key><array><array><string>%s</string><string>%s</string></array></array></dict></plist>\n' \
            '${Home}/.config/low-talker/config.toml' "${CONFIG_IN_CONTAINER}" \
            > "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/container-migration.plist"
      # [LAW:no-silent-failure] A bundle that ships without the version project.yml sets
      # fails the build rather than shipping quietly. Checked here, on the built plist,
      # because no test sees a shipped bundle: `make test` never builds the app. The input
      # method runs the same step.
      - &versionCheck
        name: The bundle carries the version project.yml sets
        basedOnDependencyAnalysis: false
        # The plist as an input is what orders this after Xcode writes it; without it the
        # step can run first and read the previous build's.
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          set -euo pipefail
          plist="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          # An empty setting reaches the script unset, not empty.
          wanted="${MARKETING_VERSION:-} (${CURRENT_PROJECT_VERSION:-})"
          short=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "${plist}" 2>/dev/null) || short="none"
          build=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "${plist}" 2>/dev/null) || build="none"
          if [ -z "${MARKETING_VERSION:-}" ] || [ -z "${CURRENT_PROJECT_VERSION:-}" ] || [ "${short} (${build})" != "${wanted}" ]; then
            echo "error: ${plist} carries version ${short} (${build}); project.yml sets '${wanted}', and both must be set and equal" >&2
            exit 1
          fi
    # xcodegen writes this plist, and Xcode merges it with the keys GENERATE_INFOPLIST_FILE
    # synthesises.
    info:
      path: App/Generated/LowTalker-Info.plist
      properties:
        # The settings, not literals: xcodegen otherwise writes its own 1.0 and 1 here, a
        # second version the shipped bundle never carries.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_NAME: LowTalker
        PRODUCT_BUNDLE_IDENTIFIER: ai.promptctl.low-talker
        # Adds com.apple.security.network.server to the entitlements written above when
        # ACCEPTS_CONNECTIONS is YES, so the network build's server can listen; the Makefile's
        # VARIANT sets it, and unset it is NO. Routed through a setting only this target
        # reads, because set on the command line it would reach the input method
        # too, which is the same bytes in both builds.
        # [LAW:one-type-per-behavior] The two builds are this one target with one value.
        ENABLE_INCOMING_NETWORK_CONNECTIONS: $(ACCEPTS_CONNECTIONS)
        # No checked-in Info.plist: Xcode synthesises one from these keys.
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_LSUIElement: true
        # The name every system dialog, notice and list puts in front of a person: macOS
        # reads the display name first, and a prompt names whatever bundle raised it.
        INFOPLIST_KEY_CFBundleDisplayName: LowTalker
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Shown inside macOS's microphone dialog, under the app's name. The guided setup
        # explains the same thing first, so the dialog repeats what the person just read.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: LowTalker listens only while you hold or tap your dictation key, to turn what you say into text. What it hears never leaves this Mac.
        # Where the bundle's resources hold the carried store, as ModelStore.carriedResourceName
        # names it; CarriedModelStoreTests holds the two equal. [LAW:one-source-of-truth]
        MODEL_STORE_RESOURCE: model-store
        # The notices' file in the bundle's resources, as Notices.resource names it;
        # CarriedNoticesTests holds the two equal. [LAW:one-source-of-truth]
        NOTICES_RESOURCE: Acknowledgements.txt
        # Where the container keeps the config, as Config.pathInContainer names it;
        # ContainerMigrationTests holds the two equal. [LAW:one-source-of-truth]
        CONFIG_IN_CONTAINER: .config/low-talker/config.toml

  # The input method the app is packaged with.
  #
  # The `.inputmethod` segment in the identifier is not decoration and its position is not
  # free: measured on macOS Tahoe, a bundle whose identifier ENDS in `.inputmethod`, or
  # carries no such segment, registers nothing at all, while `…inputmethod.dictation` is
  # taken - and `TISRegisterInputSource` answers noErr either way. `AppIdentity` is where
  # that rule is written down; this file only spends the names it decides.
  LowTalkerInputMethod:
    type: application
    platform: macOS
    sources:
      - Sources/lowtalker-inputmethod
      # The glyph the Input menu shows beside the name. A template image, so macOS tints
      # it to match the menu bar rather than the bundle carrying a light and a dark copy.
      - App/InputMethods/InputMethod.tiff
    dependencies:
      - package: low-talker
        product: InputMethod
      - package: low-talker
        product: Identity
      # Declared because main.swift imports it, the same reason `Identity` is here. It
      # builds without this line today only because Xcode leaves a transitive package
      # module importable, which is not a promise this target should rest on.
      - package: low-talker
        product: Insertion
    # macOS resolves `InputMethodServerControllerClass` through the Objective-C runtime at
    # launch, so this string and the class's `@objc` name are one fact in two places;
    # `InputMethodPlistTests` holds them equal.
    info:
      path: App/Generated/LowTalker-InputMethod-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        NSPrincipalClass: NSApplication
        NSSupportsSuddenTermination: true
        InputMethodConnectionName: ai.promptctl.low-talker.inputmethod.dictation_Connection
        InputMethodServerControllerClass: DictationInputController
        TISIntendedLanguage: en
        TISIconIsTemplate: true
        tsInputMethodIconFileKey: InputMethod.tiff
        ComponentInputModeDict:
          tsInputModeListKey:
            ai.promptctl.low-talker.inputmethod.dictation.text:
              TISInputSourceID: ai.promptctl.low-talker.inputmethod.dictation.text
              tsInputModeDefaultStateKey: true
              tsInputModeIsVisibleKey: true
              tsInputModeMenuIconFileKey: InputMethod.tiff
              # Not the primary mode for the Unicode script: that says "select me when the
              # user switches to this script", and the script here is everyone's. Of the
              # eighteen input methods in /System/Library/Input Methods only TamilIM claims
              # it, on one of its two modes, in a script it owns; AinuIM - the one-mode
              # server this bundle is shaped after - claims false.
              tsInputModePrimaryInScriptKey: false
              tsInputModeScriptKey: smUnicodeScript
          # Mode keys, not source identifiers - the two are the same string here, and a
          # wrong one is a source that silently never appears in the Input menu.
          # [LAW:no-silent-failure]
          tsVisibleInputModeOrderedArrayKey:
            - ai.promptctl.low-talker.inputmethod.dictation.text
    # Sandboxed, so the input method a person selects can reach no more than it needs: the
    # sandbox is what keeps a process handed the keyboard from reading the disk or the
    # network. It registers two names and nothing else - the text input system's connection
    # and the insert port the app sends to - and looks up one, the app's hotkey port, and a
    # sandboxed process may register or look up only the names listed here.
    # `InputMethodEntitlementsTests` holds all three to `AppIdentity`'s.
    entitlements:
      path: App/Generated/LowTalker-InputMethod.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.temporary-exception.mach-register.global-name:
          - ai.promptctl.low-talker.inputmethod.dictation_Connection
          - ai.promptctl.low-talker.inputmethod.dictation.insert
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - ai.promptctl.low-talker.hotkey
    settings:
      base:
        # The bundle and the process are named for what they are, so a person reading
        # Activity Monitor or a log line can tell this apart from the app carrying it.
        # `CFBundleName` follows PRODUCT_NAME - Xcode synthesises it and its value beats
        # anything the plist file says, measured - and that is left alone: what a person
        # reads in the Input Sources list is the LOCALIZED name, which the script below
        # writes from INPUT_METHOD_NAME, and which macOS prefers over this.
        PRODUCT_NAME: LowTalker Input Method
        INFOPLIST_KEY_CFBundleDisplayName: LowTalker Input Method
        PRODUCT_BUNDLE_IDENTIFIER: ai.promptctl.low-talker.inputmethod.dictation
        GENERATE_INFOPLIST_FILE: true
        # Read by the script below, which is the only way this bundle's one localized
        # string can be written from the same names the plist above uses.
        INPUT_SOURCE_ID: ai.promptctl.low-talker.inputmethod.dictation.text
        INPUT_METHOD_NAME: LowTalker
    # The name a person reads in the Input Sources list and the Input menu. macOS takes it
    # from the bundle's localized strings, keyed by the source identifier, and NOT from
    # `CFBundleName` alone: measured, a bundle without this file shows the raw identifier
    # for the mode. Written here rather than checked in so no input method name is spelled
    # anywhere but `AppIdentity` and this file. [LAW:one-source-of-truth]
    postBuildScripts:
      - name: The name the Input Sources list shows
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          strings="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/en.lproj/InfoPlist.strings"
          mkdir -p "$(dirname "${strings}")"
          printf '"CFBundleName" = "%s";\n"%s" = "%s";\n' \
            "${INPUT_METHOD_NAME}" "${INPUT_SOURCE_ID}" "${INPUT_METHOD_NAME}" > "${strings}"
      - *versionCheck
