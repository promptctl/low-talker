# Builds and tests every pull request to master, and master itself after a merge,
# so the merge rule has a check to gate on.
#
# [LAW:one-source-of-truth] The build recipe lives in the Makefile. This file only
# provisions a runner and calls the same targets a developer runs; if a step here
# ever spells out swift or xcodebuild directly, it has grown a second recipe.
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

# A new push to a PR supersedes the run for the SHA it replaced.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    # macos-26's default Xcode carries Swift 6.2 or later, which Package.swift asks for (main-actor
    # default isolation, SE-0466), and is the one release.yml builds with; jq is
    # preinstalled, xcodegen is not.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      # SHA-pinned, same pin and same reasoning as code-review.yml: third-party code
      # fetched on every run, including fork PRs, so a moving tag is not acceptable.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Build and test the package
        run: |
          swift build --build-tests
          defaults write NSGlobalDomain NSAppSleepDisabled -bool YES
          swift test --skip-build > /tmp/tests.log 2>&1 &
          until grep -q "Test run started" /tmp/tests.log 2>/dev/null; do sleep 0.1; done
          pgrep -fl "low-talkerPackageTests" || true
          p=$(pgrep -f "testing-library swift-testing" | tail -1)
          echo "sampling $p"
          sample "$p" 15 5 -mayDie -file /tmp/sample.txt || true
          wait || true
          grep -E "Test run with|Fatal" /tmp/tests.log | head -5 || true
          grep -E "Suite (ConfigTests|WordErrorRateTests|SampleCountTests|ChordNameTests|BuildTests) passed|Test authorizedIsAGrant" /tmp/tests.log || true
          echo "===SAMPLE==="
          cat /tmp/sample.txt
          echo "===END==="

      # The runner has no model to carry, so the bundles are built carrying none, which is
      # a build every Makefile path allows and one the app names at launch. Signing reaches
      # Apple's timestamp server, as every build's does (project.yml); a runner that cannot
      # fails here with "The timestamp service is not available".
      - name: Build the app
        run: make app BUNDLED_MODEL_STORE=
