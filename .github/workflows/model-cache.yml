# Keeps the models a release carries in the Actions cache, saved from master: a run for a tag
# can restore a cache saved on the default branch, but never one saved for another tag. So
# release.yml only restores, and this saves, under the names of the models master's model-tool
# names as carried and the Hugging Face commits `main` names for each, once per set.
name: Model cache

on:
  push:
    branches: [master]

permissions:
  contents: read
  # To check the save landed.
  actions: read

# A run partway through its download or save finishes. A later push waits, replacing any
# push already waiting, whose default is almost always the same.
concurrency:
  group: model-cache
  cancel-in-progress: false

jobs:
  cache:
    name: Cache the carried models
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      # SHA-pinned, as in ci.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # [LAW:one-source-of-truth] The same questions release.yml asks: the carried models are the
      # source's, and the commits `main` names for them are the hub's, asked through model-tool.
      - name: Name the carried models
        id: model
        run: |
          set -euo pipefail
          tool=$(make model-tool | tail -n 1)
          revision=$("$tool" revision)
          {
            echo "tool=$tool"
            echo "revision=$revision"
            echo "key=model-store-$revision"
          } >> "$GITHUB_OUTPUT"

      - name: Look the models up
        id: lookup
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/model-store
          key: ${{ steps.model.outputs.key }}
          lookup-only: true

      # A cache entry is never overwritten, so a saved key is left as it is. The fetch is
      # at the commits the key names, so what is saved under it is what it says.
      - name: Fetch the models
        if: steps.lookup.outputs.cache-hit != 'true'
        env:
          TOOL: ${{ steps.model.outputs.tool }}
          REVISION: ${{ steps.model.outputs.revision }}
        run: '"$TOOL" download --models-dir "$RUNNER_TEMP/model-store" --from "$REVISION"'

      - name: Save the models
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/model-store
          key: ${{ steps.model.outputs.key }}

      # actions/cache/save only warns when it cannot reserve or upload, so the entry is looked
      # for rather than assumed.
      - name: Check master's cache holds the models
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.model.outputs.key }}
          CACHED: ${{ steps.lookup.outputs.cache-hit }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016 # $ENV is jq's, not the shell's
          n=$(gh cache list --ref refs/heads/master --key "$KEY" --json key --jq 'map(select(.key == $ENV.KEY)) | length')
          [ "$n" = 1 ] || { echo "master's cache holds no $KEY" >&2; exit 1; }
          echo "Model cache: \`$KEY\` (already cached: ${CACHED:-false})" >> "$GITHUB_STEP_SUMMARY"
