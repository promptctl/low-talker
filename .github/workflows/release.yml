# Turns a pushed version tag into a GitHub release carrying the installer packages
# scripts/release builds from that tag: LowTalker-offline.pkg and LowTalker-network.pkg,
# signed with Developer ID, notarized and stapled.
#
# [LAW:one-source-of-truth] The recipe is scripts/release's, the same one a release made on a
# Mac runs. This file only provisions a runner with the credentials and the model, runs it,
# and publishes what it prints. The credentials are repository secrets that
# scripts/release-secrets checks and sets.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # To find and wait for model-cache.yml's run on the tagged commit.
  actions: read

# A second run for the same tag waits instead of cancelling one partway through notarizing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, notarize and publish
    # macos-26's default Xcode is the one a release made on a Mac builds with; macos-15's is not.
    runs-on: macos-26
    timeout-minutes: 120
    env:
      NOTARY_PROFILE: release
    steps:
      # [LAW:no-silent-failure] An unset secret reaches a step as an empty string, and the
      # import below then fails on its parameters without saying which. Named here, first.
      # The secrets checked are the SECRET_ variables this step is given.
      - name: Check the release secrets are set
        env:
          SECRET_DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          SECRET_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          SECRET_NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          SECRET_NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          missing=()
          for variable in "${!SECRET_@}"; do
            [ -n "${!variable}" ] || missing+=("${variable#SECRET_}")
          done
          [ "${#missing[@]}" -eq 0 ] || { echo "::error::repository secrets not set: ${missing[*]}; scripts/release-secrets sets them" >&2; exit 1; }

      # The tap's cask names one version and its sha256, so each release moves it, or `brew
      # upgrade` never sees the release. The cask is moved by starting a workflow in
      # promptctl/homebrew-tap with a token of the promptctl tap App, which is installed on
      # that repository alone with Actions: write, so the token can start the tap's workflows
      # and nothing else. TAP_APP_CLIENT_ID is a repository variable and TAP_APP_PRIVATE_KEY
      # a repository secret. This token is minted only to prove the App answers, before
      # anything is built, so a missing or wrong App fails the release while nothing is
      # published yet; the one the last step uses is minted there, since a token lasts an
      # hour and this job may run for two.
      - name: Check the tap's App answers
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.TAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: promptctl
          repositories: homebrew-tap
          permission-actions: write

      # SHA-pinned, as in ci.yml: third-party code in a job that holds the signing keys.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # scripts/release checks the tagged commit is on master, which needs its history.
          fetch-depth: 0

      - name: Install xcodegen
        run: brew install xcodegen

      # scripts/notarize requires Gatekeeper to call each package notarized, which it cannot
      # on a runner whose assessments are off; asked here rather than after notarizing.
      - name: Check Gatekeeper assesses
        run: |
          status=$(spctl --status)
          [ "$status" = "assessments enabled" ] || { echo "Gatekeeper: $status" >&2; exit 1; }

      # One keychain for the run: it holds the Developer ID identities and the notary profile.
      - name: Create an unlocked default keychain
        run: |
          keychain=$(scripts/runner-keychain release)
          echo "RELEASE_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      # With the authority they are issued under, which scripts/developer-id names.
      - name: Import the Developer ID identities
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          source scripts/developer-id
          security import "$developer_id_ca" -k "$RELEASE_KEYCHAIN"
          p12="$RUNNER_TEMP/developer-id.p12"
          base64 -D <<<"$DEVELOPER_ID_P12" > "$p12"
          security import "$p12" -k "$RELEASE_KEYCHAIN" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          rm "$p12"
          # Without it the first signature waits on a dialog nobody can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k release "$RELEASE_KEYCHAIN" >/dev/null

      # store-credentials asks the notary service before saving, so bad credentials stop here.
      # The team is the one the certificates name.
      - name: Store the notary credentials
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          source scripts/developer-id
          xcrun notarytool store-credentials "$NOTARY_PROFILE" --apple-id "$NOTARY_APPLE_ID" --team-id "$developer_team" --password "$NOTARY_PASSWORD" --keychain "$RELEASE_KEYCHAIN"

      # [LAW:one-source-of-truth] The model the release carries is the one model-tool built from
      # this tag names as its default, at the Hugging Face commits `main` names for it now.
      - name: Name the default model
        id: model
        run: |
          set -euo pipefail
          tool=$(make model-tool | tail -n 1)
          model=$("$tool" default)
          revision=$("$tool" revision --model "$model")
          {
            echo "tool=$tool"
            echo "default=$model"
            echo "revision=$revision"
            echo "key=model-store-$model-$revision"
          } >> "$GITHUB_OUTPUT"

      # [LAW:no-ambient-temporal-coupling] The tag usually follows its commit's push to master
      # by seconds, and that push's model-cache.yml run may still be saving. What the restore
      # needs is the entry, so the release waits until master holds it, or until no
      # model-cache.yml run is left that could save it, or 40 minutes. Either of the last two,
      # or a GitHub API that keeps failing, leaves the fill below to fetch the whole model.
      - name: Wait for the model cache
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.model.outputs.key }}
        run: |
          set -uo pipefail
          # shellcheck disable=SC2016 # $ENV is jq's, not the shell's
          saved() { [ "$(gh cache list --ref refs/heads/master --key "$KEY" --json key --jq 'map(select(.key == $ENV.KEY)) | length')" = 1 ]; }
          idle() { [ "$(gh run list --workflow model-cache.yml --json status --jq 'map(select(.status != "completed")) | length')" = 0 ]; }
          deadline=$((SECONDS + 2400))
          until saved; do
            if idle || [ "$SECONDS" -ge "$deadline" ]; then
              echo "::warning::master's cache holds no $KEY; the model comes from huggingface.co"
              exit 0
            fi
            sleep 30
          done

      # Saved by model-cache.yml on master; a run for a tag cannot restore another tag's save,
      # so this one saves nothing.
      - name: Restore the model store
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/model-store
          key: ${{ steps.model.outputs.key }}

      # [LAW:dataflow-not-control-flow] Run whether the cache hit or not: it fetches from
      # huggingface.co whatever the store's manifests find missing or of the wrong size, so a
      # hit fetches nothing and a miss fetches the whole model. Nothing here hashes contents.
      # Either way it fetches at the commits the key names, so the store is the key's.
      - name: Fill the model store
        env:
          TOOL: ${{ steps.model.outputs.tool }}
          REVISION: ${{ steps.model.outputs.revision }}
        run: '"$TOOL" download --models-dir "$RUNNER_TEMP/model-store" --from "$REVISION"'

      - name: Build, sign and notarize
        env:
          NOTARY_KEYCHAIN: ${{ env.RELEASE_KEYCHAIN }}
        run: |
          set -euo pipefail
          scripts/release "$RUNNER_TEMP/packages" "$RUNNER_TEMP/model-store" > "$RUNNER_TEMP/packages.txt"
          cat "$RUNNER_TEMP/packages.txt"

      # The notes are the tag's annotation, or its commit's message for a lightweight tag. The
      # checkout fetched the tag as a bare ref to the commit, so the tag itself is fetched to
      # read its annotation. A version with a hyphen, v0.1.0-alpha.7, is a prerelease.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          MODEL: ${{ steps.model.outputs.default }}
          REVISION: ${{ steps.model.outputs.revision }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          case "$TAG" in
            *-*) kind=--prerelease ;;
            *) kind=--latest ;;
          esac
          pkgs=()
          while IFS= read -r pkg; do pkgs+=("$pkg"); done < "$RUNNER_TEMP/packages.txt"
          gh release create "$TAG" --verify-tag --notes-from-tag --title "LowTalker ${TAG#v}" "$kind" "${pkgs[@]}"
          {
            echo "## $TAG"
            echo
            echo "Model: \`$MODEL\` at \`$REVISION\` (cache hit: ${CACHE_HIT:-false})"
            echo
            echo '```'
            shasum -a 256 "${pkgs[@]}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: The tap's token
        id: tap
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.TAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: promptctl
          repositories: homebrew-tap
          permission-actions: write

      # The tap's low-talker workflow (cask.yml here) is the one writer of the cask, with the
      # tap's own token; this starts it and waits until the cask is at this release. The cask
      # is the verdict, not the run: a run the tap's concurrency group cancelled leaves the
      # cask to the run that replaced it. The release is published by now, so if this fails,
      # `gh workflow run low-talker.yaml --repo promptctl/homebrew-tap` moves the cask without
      # re-running this job.
      - name: The tap's cask is at this release
        env:
          GH_TOKEN: ${{ steps.tap.outputs.token }}
          READ_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          trap '[ $? -eq 0 ] || echo "::error::$TAG is published; move the cask with \`gh workflow run low-talker.yaml --repo promptctl/homebrew-tap\` rather than re-running this job"' EXIT
          run=$(gh api --method POST repos/promptctl/homebrew-tap/actions/workflows/low-talker.yaml/dispatches -f ref=main -F return_run_details=true \
            --jq '.workflow_run_id // error("the dispatch named no run")')
          url=https://github.com/promptctl/homebrew-tap/actions/runs/$run
          echo "moving the cask in $url"
          while :; do
            fields=$(gh run view "$run" --repo promptctl/homebrew-tap --json status,conclusion --jq '"\(.status) \(.conclusion)"')
            read -r status conclusion <<<"$fields"
            was=$(GH_TOKEN=$READ_TOKEN gh api -H 'Accept: application/vnd.github.raw' repos/promptctl/homebrew-tap/contents/Casks/low-talker.rb | sed -n 's/^  version "\(.*\)"$/\1/p')
            [ "$was" = "${TAG#v}" ] && break
            [ "$status" != completed ] || [ "$conclusion" = cancelled ] \
              || { echo "::error::the tap's run ended $conclusion and left the cask at $was: $url"; exit 1; }
            [ "$SECONDS" -lt 600 ] || { echo "::error::after ${SECONDS}s the cask is at $was and the tap's run is $status $conclusion: $url"; exit 1; }
            sleep 10
          done
          echo "the tap's cask is low-talker $was; run $url" | tee -a "$GITHUB_STEP_SUMMARY"
